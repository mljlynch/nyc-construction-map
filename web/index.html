<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NYC New Construction</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
:root {
  --surface-0: #f4f3f0; --surface-1: #fcfcfb; --border: #e2e0db;
  --text-primary: #0b0b0b; --text-secondary: #52514e; --text-muted: #7c7b76;
  --accent: #2a78d6; --zero: #ebe9e4; --outline: #ffffff; --provisional: #b45f06;
  --s1: #cde2fb; --s2: #9ec5f4; --s3: #6da7ec; --s4: #3987e5; --s5: #256abf; --s6: #184f95; --s7: #0d366b;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --surface-0: #121211; --surface-1: #1a1a19; --border: #33332f;
    --text-primary: #f0efec; --text-secondary: #c3c2b7; --text-muted: #8f8e86;
    --accent: #3987e5; --zero: #2a2a27; --outline: #1a1a19; --provisional: #f0a04b;
    --s1: #0d366b; --s2: #104281; --s3: #1c5cab; --s4: #2a78d6; --s5: #5598e7; --s6: #86b6ef; --s7: #cde2fb;
  }
}
:root[data-theme="dark"] {
  --surface-0: #121211; --surface-1: #1a1a19; --border: #33332f;
  --text-primary: #f0efec; --text-secondary: #c3c2b7; --text-muted: #8f8e86;
  --accent: #3987e5; --zero: #2a2a27; --outline: #1a1a19; --provisional: #f0a04b;
  --s1: #0d366b; --s2: #104281; --s3: #1c5cab; --s4: #2a78d6; --s5: #5598e7; --s6: #86b6ef; --s7: #cde2fb;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--surface-0); color: var(--text-primary); font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
.app { display: grid; grid-template-columns: 1fr 360px; grid-template-rows: auto 1fr auto; height: 100vh; }
header { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; padding: 10px 16px; background: var(--surface-1); border-bottom: 1px solid var(--border); }
header h1 { font-size: 15px; margin: 0 8px 0 0; font-weight: 600; }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
.seg button { border: 0; background: transparent; color: var(--text-secondary); padding: 5px 10px; font: inherit; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--border); }
.seg button[aria-pressed="true"] { background: var(--accent); color: #fff; }
.seg button:disabled { opacity: .4; cursor: not-allowed; }
select { font: inherit; padding: 4px 6px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface-1); color: var(--text-primary); }
#map { position: relative; min-height: 300px; }
aside { grid-row: 2 / 4; grid-column: 2; overflow-y: auto; background: var(--surface-1); border-left: 1px solid var(--border); padding: 14px 16px; }
aside h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--text-muted); margin: 18px 0 8px; font-weight: 600; }
aside h2:first-child { margin-top: 0; }
.timebar { grid-column: 1; display: flex; align-items: center; gap: 12px; padding: 10px 16px; background: var(--surface-1); border-top: 1px solid var(--border); }
.timebar input[type=range] { flex: 1; accent-color: var(--accent); }
#play { width: 34px; height: 30px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface-1); color: var(--text-primary); cursor: pointer; font-size: 13px; }
#monthLabel { font-variant-numeric: tabular-nums; font-weight: 600; min-width: 74px; }
.badge { font-size: 11px; padding: 2px 6px; border-radius: 4px; border: 1px solid var(--provisional); color: var(--provisional); white-space: nowrap; }
.legend { position: absolute; left: 12px; bottom: 12px; background: var(--surface-1); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; z-index: 2; max-width: 300px; }
.legend .title { color: var(--text-secondary); margin-bottom: 6px; font-size: 12px; }
.legend .swatches { display: flex; gap: 2px; }
.legend .sw { flex: 1; height: 10px; min-width: 26px; }
.legend .sw:first-child { border-radius: 3px 0 0 3px; } .legend .sw:last-child { border-radius: 0 3px 3px 0; }
.legend .ticks { display: flex; gap: 2px; font-size: 10px; color: var(--text-muted); font-variant-numeric: tabular-nums; }
.legend .ticks span { flex: 1; min-width: 26px; }
.legend .row { display: flex; align-items: center; gap: 6px; margin-top: 6px; font-size: 11px; color: var(--text-muted); }
.legend .zero { width: 14px; height: 10px; background: var(--zero); border-radius: 2px; border: 1px solid var(--border); }
.tip { position: absolute; pointer-events: none; background: var(--surface-1); border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; box-shadow: 0 2px 8px rgba(0,0,0,.15); font-size: 12px; z-index: 5; display: none; white-space: nowrap; }
.tip b { font-variant-numeric: tabular-nums; }
.boro { display: grid; grid-template-columns: 100px 1fr 64px; align-items: center; gap: 8px; padding: 3px 0; cursor: pointer; border-radius: 4px; }
.boro:hover { background: var(--surface-0); }
.boro .bar { height: 10px; background: var(--accent); border-radius: 0 4px 4px 0; min-width: 1px; }
.boro .v { text-align: right; font-variant-numeric: tabular-nums; }
.boro.dim { opacity: .4; }
.total { display: flex; justify-content: space-between; border-top: 1px solid var(--border); margin-top: 6px; padding-top: 6px; font-weight: 600; font-variant-numeric: tabular-nums; }
.muted { color: var(--text-muted); }
.hero { font-size: 26px; font-weight: 600; font-variant-numeric: tabular-nums; }
#chart svg { display: block; width: 100%; max-width: 440px; }
#chart .axis text { fill: var(--text-muted); font-size: 10px; }
#chart .grid line { stroke: var(--border); }
.note { font-size: 11px; color: var(--text-muted); margin-top: 10px; }
.note p { margin: 0 0 6px; }
details summary { cursor: pointer; color: var(--text-secondary); }
table.data { width: 100%; border-collapse: collapse; font-size: 11px; font-variant-numeric: tabular-nums; margin-top: 6px; }
table.data td, table.data th { padding: 2px 4px; text-align: right; border-bottom: 1px solid var(--border); }
table.data td:first-child, table.data th:first-child { text-align: left; }
@media (max-width: 820px) {
  .app { grid-template-columns: 1fr; grid-template-rows: auto 55vh auto auto; height: auto; }
  aside { grid-row: auto; grid-column: 1; border-left: 0; border-top: 1px solid var(--border); }
  .timebar { grid-column: 1; }
  header { padding: 10px 16px; }
}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>NYC new residential construction</h1>
    <div class="seg" id="metric" role="group" aria-label="Measure">
      <button data-v="u" aria-pressed="true">Units</button><button data-v="j">Buildings</button>
    </div>
    <div class="seg" id="flow" role="group" aria-label="Stage">
      <button data-v="p" aria-pressed="true">Permitted</button><button data-v="c">Completed</button><button data-v="i">In progress</button>
    </div>
    <div class="seg" id="mode" role="group" aria-label="Time aggregation">
      <button data-v="single" aria-pressed="true">Single month</button><button data-v="cum">Cumulative</button>
    </div>
    <div class="seg" id="scale" role="group" aria-label="Color scale">
      <button data-v="quantile" aria-pressed="true">Quantile</button><button data-v="log">Log</button>
    </div>
    <label>Borough <select id="boro"><option value="">All boroughs</option></select></label>
  </header>
  <div id="map"><div class="legend" id="legend"></div><div class="tip" id="tip"></div></div>
  <aside>
    <h2 id="totalsTitle">Borough totals</h2>
    <div id="boros"></div>
    <h2 id="nbhdTitle">Neighborhood</h2>
    <div id="nbhd" class="muted">Click a neighborhood on the map to see its monthly history.</div>
    <div id="chart"></div>
    <div class="note" id="notes"></div>
  </aside>
  <div class="timebar">
    <button id="play" aria-label="Play">▶</button>
    <span id="monthLabel"></span>
    <input id="slider" type="range" min="0" value="0" aria-label="Month">
    <span id="prov" class="badge" hidden>Provisional · DOB NOW</span>
  </div>
</div>
<script>
const $ = s => document.querySelector(s);
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const fmt = n => Math.round(n).toLocaleString('en-US');
const FLOW = { p: 'permitted', c: 'completed', i: 'in progress' };
const METRIC = { u: 'units', j: 'buildings' };
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const mLabel = m => `${MONTHS[+m.slice(5) - 1]} ${m.slice(0, 4)}`;

const state = { metric: 'u', flow: 'p', mode: 'single', scale: 'quantile', boro: '', t: 0, sel: null, playing: null };
let meta, series, cum, geo, ntaInfo = {}, breaks = [], map;

function seg(id, key, after) {
  $(id).addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b || b.disabled) return;
    state[key] = b.dataset.v;
    $(id).querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b));
    after?.(); refresh(true);
  });
}

// Value for one NTA at month index t under the current toggles.
function val(nta, t) {
  const k = state.flow + state.metric;
  if (state.flow === 'i' || state.mode === 'single') return series[nta]?.[k][t] ?? 0;
  return cum[nta]?.[k][t] ?? 0;
}
const inBoro = nta => !state.boro || ntaInfo[nta]?.boro === state.boro;

// Breaks span every month of the current view so colors stay comparable while playing;
// quantiles of non-zero values keep the 2015/2022 421-a spikes from washing out every other month.
function computeBreaks() {
  const vals = [];
  for (const nta in series) if (inBoro(nta)) for (let t = 0; t < meta.months.length; t++) { const v = val(nta, t); if (v > 0) vals.push(v); }
  vals.sort((a, b) => a - b);
  const n = 7;
  if (!vals.length) return [1, 2, 3, 4, 5, 6];
  if (state.scale === 'log') {
    const lo = Math.log10(Math.max(1, vals[0])), hi = Math.log10(vals[vals.length - 1]);
    return Array.from({ length: n - 1 }, (_, i) => Math.round(10 ** (lo + (hi - lo) * (i + 1) / n)));
  }
  const q = Array.from({ length: n - 1 }, (_, i) => vals[Math.floor(vals.length * (i + 1) / n)]);
  for (let i = 1; i < q.length; i++) if (q[i] <= q[i - 1]) q[i] = q[i - 1] + 1;
  return q;
}
function classOf(v) { if (v <= 0) return 0; let c = 1; for (const b of breaks) if (v >= b) c++; return c; }

function fillExpr() {
  const c = ['var(--zero)', '--s1', '--s2', '--s3', '--s4', '--s5', '--s6', '--s7'].map((v, i) => i ? css(v) : css('--zero'));
  return ['match', ['coalesce', ['feature-state', 'c'], 0], 0, c[0], 1, c[1], 2, c[2], 3, c[3], 4, c[4], 5, c[5], 6, c[6], c[7]];
}

function paint() {
  const t = state.t;
  for (const f of geo.features) {
    const nta = f.properties.nta;
    map.setFeatureState({ source: 'nta', id: nta }, { c: classOf(val(nta, t)), dim: !inBoro(nta), sel: nta === state.sel });
  }
}

function legend() {
  const sw = ['--s1', '--s2', '--s3', '--s4', '--s5', '--s6', '--s7'].map(v => `<div class="sw" style="background:${css(v)}"></div>`).join('');
  const lows = [1, ...breaks];
  const ticks = lows.map(b => `<span>${b >= 1000 ? (b / 1000).toFixed(b >= 10000 ? 0 : 1) + 'k' : fmt(b)}+</span>`).join('');
  const what = `${METRIC[state.metric]} ${FLOW[state.flow]}${state.flow === 'i' ? ' (snapshot)' : state.mode === 'cum' ? ' since Jan 2010' : ' in month'}`;
  $('#legend').innerHTML = `<div class="title">${what[0].toUpperCase() + what.slice(1)} · ${state.scale}</div><div class="swatches">${sw}</div><div class="ticks">${ticks}</div><div class="row"><span class="zero"></span>None</div>`;
}

function boroPanel() {
  const t = state.t, tot = {};
  for (const b of meta.boros) tot[b] = 0;
  for (const nta in series) { const b = ntaInfo[nta]?.boro; if (b in tot) tot[b] += val(nta, t); }
  const max = Math.max(1, ...Object.values(tot));
  const sum = Object.values(tot).reduce((a, b) => a + b, 0);
  $('#totalsTitle').textContent = `Borough totals · ${mLabel(meta.months[t])}`;
  $('#boros').innerHTML = `<div class="muted" style="margin-bottom:6px">${METRIC[state.metric]} ${FLOW[state.flow]}${state.flow === 'i' ? ' at month end' : state.mode === 'cum' ? ', Jan 2010 to date' : ' this month'}</div>` +
    meta.boros.map(b => `<div class="boro ${state.boro && state.boro !== b ? 'dim' : ''}" data-b="${b}"><span>${b}</span><div class="bar" style="width:${tot[b] / max * 100}%"></div><span class="v">${fmt(tot[b])}</span></div>`).join('') +
    `<div class="total"><span>New York City</span><span>${fmt(sum)}</span></div>`;
}

function nbhdPanel() {
  if (!state.sel) return;
  const nta = state.sel, info = ntaInfo[nta], k = state.flow + state.metric;
  const s = series[nta]?.[k] ?? meta.months.map(() => 0);
  $('#nbhdTitle').textContent = 'Neighborhood';
  $('#nbhd').classList.remove('muted');
  $('#nbhd').innerHTML = `<div style="font-weight:600">${info.name}</div><div class="muted">${info.boro} · ${nta}</div>` +
    `<div style="margin-top:8px"><span class="hero">${fmt(val(nta, state.t))}</span> <span class="muted">${METRIC[state.metric]} ${FLOW[state.flow]} · ${mLabel(meta.months[state.t])}${state.mode === 'cum' && state.flow !== 'i' ? ' (cumulative)' : ''}</span></div>`;
  drawChart(s);
}

// Monthly series: bars for flows, an area for the in-progress snapshot. Always per-month
// (not cumulative) so the spikes the cumulative view smooths over stay visible.
function drawChart(s) {
  const W = 328, H = 170, m = { l: 36, r: 6, t: 10, b: 20 };
  const n = s.length, iw = W - m.l - m.r, ih = H - m.t - m.b;
  const max = Math.max(1, ...s);
  const nice = (() => { const p = 10 ** Math.floor(Math.log10(max)); for (const f of [1, 2, 2.5, 5, 10]) if (f * p >= max) return f * p; })();
  const x = i => m.l + (i + .5) * iw / n, y = v => m.t + ih - v / nice * ih, bw = Math.max(1, iw / n - .6);
  const provIdx = meta.provisionalFrom ? meta.months.indexOf(meta.provisionalFrom) : -1;
  let marks;
  if (state.flow === 'i') {
    const pts = s.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
    marks = `<polygon points="${x(0)},${y(0)} ${pts} ${x(n - 1)},${y(0)}" fill="${css('--accent')}" opacity=".18"/><polyline points="${pts}" fill="none" stroke="${css('--accent')}" stroke-width="2" stroke-linejoin="round"/>`;
  } else {
    marks = s.map((v, i) => v > 0 ? `<rect x="${(x(i) - bw / 2).toFixed(1)}" y="${y(v).toFixed(1)}" width="${bw.toFixed(2)}" height="${(y(0) - y(v)).toFixed(1)}" fill="${css('--accent')}" opacity="${provIdx >= 0 && i >= provIdx ? .5 : 1}"/>` : '').join('');
  }
  const yt = [0, nice / 2, nice].map(v => `<g class="grid"><line x1="${m.l}" x2="${W - m.r}" y1="${y(v)}" y2="${y(v)}"/></g><g class="axis"><text x="${m.l - 4}" y="${y(v) + 3}" text-anchor="end">${v >= 1000 ? v / 1000 + 'k' : v}</text></g>`).join('');
  const xt = meta.months.map((mo, i) => mo.endsWith('-01') && +mo.slice(0, 4) % 4 === 2 ? `<g class="axis"><text x="${x(i)}" y="${H - 6}" text-anchor="middle">${mo.slice(0, 4)}</text></g>` : '').join('');
  const prov = provIdx >= 0 ? `<rect x="${x(provIdx) - iw / n / 2}" y="${m.t}" width="${W - m.r - x(provIdx) + iw / n / 2}" height="${ih}" fill="${css('--provisional')}" opacity=".08"/>` : '';
  $('#chart').innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Monthly ${METRIC[state.metric]} ${FLOW[state.flow]}">${yt}${prov}${xt}${marks}
    <line id="cur" x1="${x(state.t)}" x2="${x(state.t)}" y1="${m.t}" y2="${m.t + ih}" stroke="${css('--text-primary')}" stroke-width="1" stroke-dasharray="2 2"/>
    <line id="hov" y1="${m.t}" y2="${m.t + ih}" stroke="${css('--text-muted')}" stroke-width="1" visibility="hidden"/>
    <rect id="hit" x="${m.l}" y="${m.t}" width="${iw}" height="${ih}" fill="transparent"/></svg>
    <details><summary>Table view</summary><table class="data"><tr><th>Year</th><th>${state.flow === 'i' ? 'Dec snapshot' : 'Total'}</th></tr>${yearRows(s)}</table></details>`;
  const svg = $('#chart svg'), hit = $('#hit'), tip = $('#tip');
  hit.addEventListener('mousemove', e => {
    const r = svg.getBoundingClientRect(), px = (e.clientX - r.left) * W / r.width;
    const i = Math.max(0, Math.min(n - 1, Math.floor((px - m.l) / iw * n)));
    $('#hov').setAttribute('x1', x(i)); $('#hov').setAttribute('x2', x(i)); $('#hov').setAttribute('visibility', 'visible');
    showTip(e, `${mLabel(meta.months[i])}<br><b>${fmt(s[i])}</b> ${METRIC[state.metric]} ${FLOW[state.flow]}${provIdx >= 0 && i >= provIdx ? '<br><span class="muted">provisional</span>' : ''}`);
  });
  hit.addEventListener('mouseleave', () => { $('#hov').setAttribute('visibility', 'hidden'); tip.style.display = 'none'; });
  hit.addEventListener('click', e => { const r = svg.getBoundingClientRect(); setT(Math.max(0, Math.min(n - 1, Math.floor(((e.clientX - r.left) * W / r.width - m.l) / iw * n)))); });
}
function yearRows(s) {
  const by = {};
  meta.months.forEach((mo, i) => { const y = mo.slice(0, 4); by[y] = state.flow === 'i' ? s[i] : (by[y] || 0) + s[i]; });
  return Object.entries(by).map(([y, v]) => `<tr><td>${y}</td><td>${fmt(v)}</td></tr>`).join('');
}

function showTip(e, html) {
  const tip = $('#tip'), host = $('#map').getBoundingClientRect();
  tip.innerHTML = html; tip.style.display = 'block';
  tip.style.position = 'fixed';
  const w = tip.offsetWidth;
  tip.style.left = Math.min(window.innerWidth - w - 8, e.clientX + 12) + 'px';
  tip.style.top = (e.clientY + 12) + 'px';
}

function setT(t) {
  state.t = t; $('#slider').value = t;
  const mo = meta.months[t];
  $('#monthLabel').textContent = mLabel(mo);
  $('#prov').hidden = !(meta.provisionalFrom && mo >= meta.provisionalFrom);
  paint(); boroPanel(); nbhdPanel();
}

function refresh(rebreak) {
  $('#mode').querySelectorAll('button').forEach(b => b.disabled = state.flow === 'i' && b.dataset.v === 'cum');
  if (rebreak) { breaks = computeBreaks(); legend(); }
  setT(state.t);
}

function play() {
  if (state.playing) { clearInterval(state.playing); state.playing = null; $('#play').textContent = '▶'; $('#play').setAttribute('aria-label', 'Play'); return; }
  if (state.t >= meta.months.length - 1) setT(0);
  $('#play').textContent = '❚❚'; $('#play').setAttribute('aria-label', 'Pause');
  state.playing = setInterval(() => { if (state.t >= meta.months.length - 1) return play(); setT(state.t + 1); }, 140);
}

function fitBoro() {
  const bb = [180, 90, -180, -90];
  const walk = c => typeof c[0] === 'number' ? (bb[0] = Math.min(bb[0], c[0]), bb[1] = Math.min(bb[1], c[1]), bb[2] = Math.max(bb[2], c[0]), bb[3] = Math.max(bb[3], c[1])) : c.forEach(walk);
  geo.features.forEach(f => { if (!state.boro || f.properties.boro === state.boro) walk(f.geometry.coordinates); });
  map.fitBounds([[bb[0], bb[1]], [bb[2], bb[3]]], { padding: 30, duration: 600 });
}

async function main() {
  [meta, series, geo] = await Promise.all(['data/meta.json', 'data/series.json', 'data/ntas.geojson'].map(u => fetch(u).then(r => r.json())));
  for (const f of geo.features) ntaInfo[f.properties.nta] = f.properties;
  cum = {};
  for (const nta in series) { cum[nta] = {}; for (const k in series[nta]) { let a = 0; cum[nta][k] = series[nta][k].map(v => a += v); } }
  meta.boros.forEach(b => $('#boro').insertAdjacentHTML('beforeend', `<option>${b}</option>`));
  $('#slider').max = meta.months.length - 1;
  // Open on the last month fully covered by the Housing Database (its cutoff month is partial).
  state.t = meta.hdbPermitCutoff ? meta.months.indexOf(meta.hdbPermitCutoff.slice(0, 7)) - 1 : meta.months.length - 1;
  $('#notes').innerHTML = `<p>Source: NYC DCP Housing Database ${meta.hdbVersion} (new buildings${meta.includeAlterations ? ' and unit-adding alterations' : ''}; withdrawn jobs excluded). Units are net new Class A units. Permitted by first permit date, completed by first certificate of occupancy.</p>` +
    (meta.provisionalFrom ? `<p>From ${mLabel(meta.provisionalFrom)} on, permits come from DOB NOW new-building filings not yet in the Housing Database (one record per job, earliest permit). Completions stop at ${meta.hdbCompleteCutoff}, so in-progress counts after that date run high.</p>` : '') +
    (meta.staleYears ? `<p>"In progress" = permitted and not yet complete at month end; jobs still open ${meta.staleYears} years after their permit are treated as abandoned.</p>` : '') +
    `<p>The 2015 and 2022 spikes are filings rushed in before the 421-a tax break expired. Colors use breaks over every month in view so playback stays comparable.</p>`;

  map = new maplibregl.Map({
    container: 'map',
    style: matchMedia('(prefers-color-scheme: dark)').matches ? 'https://basemaps.cartocdn.com/gl/dark-matter-nolabels-gl-style/style.json' : 'https://basemaps.cartocdn.com/gl/positron-nolabels-gl-style/style.json',
    center: [-73.94, 40.70], zoom: 9.6, attributionControl: { compact: true },
  });
  map.addControl(new maplibregl.NavigationControl({ showCompass: false }), 'top-right');
  map.on('load', () => {
    map.addSource('nta', { type: 'geojson', data: geo, promoteId: 'nta' });
    map.addLayer({ id: 'nta-fill', type: 'fill', source: 'nta', paint: {
      'fill-color': fillExpr(),
      'fill-opacity': ['case', ['boolean', ['feature-state', 'dim'], false], 0.15, 0.92] } });
    map.addLayer({ id: 'nta-line', type: 'line', source: 'nta', paint: { 'line-color': css('--outline'), 'line-width': 0.6 } });
    map.addLayer({ id: 'nta-sel', type: 'line', source: 'nta', paint: { 'line-color': css('--text-primary'), 'line-width': ['case', ['boolean', ['feature-state', 'sel'], false], 2.5, 0] } });
    map.on('mousemove', 'nta-fill', e => {
      map.getCanvas().style.cursor = 'pointer';
      const p = e.features[0].properties;
      showTip(e.originalEvent, `<div style="font-weight:600">${p.name}</div><span class="muted">${p.boro}</span><br><b>${fmt(val(p.nta, state.t))}</b> ${METRIC[state.metric]} ${FLOW[state.flow]}`);
    });
    map.on('mouseleave', 'nta-fill', () => { map.getCanvas().style.cursor = ''; $('#tip').style.display = 'none'; });
    map.on('click', 'nta-fill', e => { state.sel = e.features[0].properties.nta; paint(); nbhdPanel(); });
    refresh(true);
  });

  seg('#metric', 'metric'); seg('#flow', 'flow', () => { if (state.flow === 'i' && state.mode === 'cum') { state.mode = 'single'; $('#mode').querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === 'single')); } });
  seg('#mode', 'mode'); seg('#scale', 'scale');
  $('#boro').addEventListener('change', e => { state.boro = e.target.value; fitBoro(); refresh(true); });
  $('#boros').addEventListener('click', e => { const b = e.target.closest('.boro'); if (!b) return; state.boro = state.boro === b.dataset.b ? '' : b.dataset.b; $('#boro').value = state.boro; fitBoro(); refresh(true); });
  $('#slider').addEventListener('input', e => setT(+e.target.value));
  $('#play').addEventListener('click', play);
  document.addEventListener('keydown', e => { if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return; if (e.key === ' ') { e.preventDefault(); play(); } if (e.key === 'ArrowRight') setT(Math.min(meta.months.length - 1, state.t + 1)); if (e.key === 'ArrowLeft') setT(Math.max(0, state.t - 1)); });
}
main();
</script>
</body>
</html>
