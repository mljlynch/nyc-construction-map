<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NYC New Construction</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
:root {
  --surface-0: #f4f3f0; --surface-1: #fcfcfb; --border: #e2e0db;
  --text-primary: #0b0b0b; --text-secondary: #52514e; --text-muted: #7c7b76;
  --accent: #2a78d6; --marker: #eb6834; --zero: #ebe9e4; --outline: #ffffff; --provisional: #b45f06;
  --s1: #cde2fb; --s2: #9ec5f4; --s3: #6da7ec; --s4: #3987e5; --s5: #256abf; --s6: #184f95; --s7: #0d366b;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --surface-0: #121211; --surface-1: #1a1a19; --border: #33332f;
    --text-primary: #f0efec; --text-secondary: #c3c2b7; --text-muted: #8f8e86;
    --accent: #3987e5; --marker: #d95926; --zero: #2a2a27; --outline: #1a1a19; --provisional: #f0a04b;
    --s1: #cde2fb; --s2: #9ec5f4; --s3: #6da7ec; --s4: #3987e5; --s5: #256abf; --s6: #184f95; --s7: #0d366b;
  }
}
:root[data-theme="dark"] {
  --surface-0: #121211; --surface-1: #1a1a19; --border: #33332f;
  --text-primary: #f0efec; --text-secondary: #c3c2b7; --text-muted: #8f8e86;
  --accent: #3987e5; --marker: #d95926; --zero: #2a2a27; --outline: #1a1a19; --provisional: #f0a04b;
  --s1: #cde2fb; --s2: #9ec5f4; --s3: #6da7ec; --s4: #3987e5; --s5: #256abf; --s6: #184f95; --s7: #0d366b;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--surface-0); color: var(--text-primary); font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
.app { display: grid; grid-template-columns: 1fr 360px; grid-template-rows: auto 1fr auto; height: 100vh; }
header { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; padding: 10px 16px; background: var(--surface-1); border-bottom: 1px solid var(--border); }
header h1 { font-size: 15px; margin: 0 8px 0 0; font-weight: 600; }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
.seg button { border: 0; background: transparent; color: var(--text-secondary); padding: 5px 10px; font: inherit; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--border); }
.seg button[aria-pressed="true"] { background: var(--accent); color: #fff; }
.seg button:disabled { opacity: .4; cursor: not-allowed; }
select { font: inherit; padding: 4px 6px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface-1); color: var(--text-primary); }
#map { position: relative; min-height: 300px; }
aside { grid-row: 2 / 4; grid-column: 2; overflow-y: auto; background: var(--surface-1); border-left: 1px solid var(--border); padding: 14px 16px; }
aside h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--text-muted); margin: 18px 0 8px; font-weight: 600; }
aside h2:first-child { margin-top: 0; }
.timebar { grid-column: 1; display: flex; align-items: center; gap: 12px; padding: 10px 16px; background: var(--surface-1); border-top: 1px solid var(--border); }
#rangeLabel { font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; min-width: 170px; }
.range { position: relative; flex: 1; height: 38px; min-width: 160px; }
.range .track { position: absolute; left: 8px; right: 8px; top: 11px; height: 4px; border-radius: 2px; background: var(--border); }
.range .fill { position: absolute; top: 0; bottom: 0; background: var(--accent); border-radius: 2px; }
.range input { position: absolute; left: 0; top: 4px; width: 100%; height: 18px; margin: 0; background: transparent; pointer-events: none; -webkit-appearance: none; appearance: none; }
.range input::-webkit-slider-runnable-track { background: transparent; height: 18px; }
.range input::-moz-range-track { background: transparent; }
.range input::-webkit-slider-thumb { -webkit-appearance: none; pointer-events: auto; width: 16px; height: 16px; margin-top: 1px; border-radius: 50%; background: var(--surface-1); border: 2px solid var(--accent); cursor: grab; }
.range input::-moz-range-thumb { pointer-events: auto; width: 12px; height: 12px; border-radius: 50%; background: var(--surface-1); border: 2px solid var(--accent); cursor: grab; }
.range input:disabled::-webkit-slider-thumb { visibility: hidden; }
.range input:disabled::-moz-range-thumb { visibility: hidden; }
.range .years { position: absolute; left: 8px; right: 8px; top: 24px; height: 12px; font-size: 10px; color: var(--text-muted); }
.range .years span { position: absolute; transform: translateX(-50%); }
.ms { position: relative; }
#msBtn { font: inherit; padding: 4px 8px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface-1); color: var(--text-primary); cursor: pointer; max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ms-panel { position: absolute; top: calc(100% + 4px); left: 0; z-index: 20; width: 300px; max-width: calc(100vw - 32px); background: var(--surface-1); border: 1px solid var(--border); border-radius: 8px; box-shadow: 0 6px 20px rgba(0,0,0,.25); }
.ms-head { display: flex; gap: 6px; padding: 8px; border-bottom: 1px solid var(--border); }
.ms-head input { flex: 1; min-width: 0; font: inherit; padding: 4px 6px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface-0); color: var(--text-primary); }
.ms-head button { font: inherit; padding: 4px 8px; border: 1px solid var(--border); border-radius: 6px; background: transparent; color: var(--text-secondary); cursor: pointer; }
.ms-list { max-height: 320px; overflow-y: auto; padding: 4px 0; }
.ms-list .grp { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--text-muted); padding: 6px 10px 2px; }
.ms-list label { display: flex; gap: 8px; align-items: center; padding: 3px 10px; cursor: pointer; }
.ms-list label:hover { background: var(--surface-0); }
.ms-list input { accent-color: var(--accent); }
#play { width: 34px; height: 30px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface-1); color: var(--text-primary); cursor: pointer; font-size: 13px; }
.badge { font-size: 11px; padding: 2px 6px; border-radius: 4px; border: 1px solid var(--provisional); color: var(--provisional); white-space: nowrap; }
.legend { position: absolute; left: 12px; bottom: 12px; background: var(--surface-1); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; z-index: 2; max-width: 300px; }
.legend .title { color: var(--text-secondary); margin-bottom: 6px; font-size: 12px; }
.legend .lrows { display: grid; gap: 2px; font-size: 11px; color: var(--text-secondary); font-variant-numeric: tabular-nums; }
.legend .lrow { display: flex; align-items: center; gap: 8px; }
.legend .lsw { width: 22px; height: 12px; border-radius: 2px; }
.legend .sizes { display: flex; align-items: flex-end; gap: 10px; margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--border); font-size: 10px; color: var(--text-muted); }
.legend .sizes div { display: flex; flex-direction: column; align-items: center; gap: 2px; }
.legend .dot { border-radius: 50%; background: var(--marker); opacity: .8; border: 1px solid var(--outline); }
.legend .zero { background: var(--zero); border: 1px solid var(--border); }
.tip { position: absolute; pointer-events: none; background: var(--surface-1); border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; box-shadow: 0 2px 8px rgba(0,0,0,.15); font-size: 12px; z-index: 5; display: none; white-space: nowrap; }
.tip b { font-variant-numeric: tabular-nums; }
.boro { display: grid; grid-template-columns: 100px 1fr 64px; align-items: center; gap: 8px; padding: 3px 0; cursor: pointer; border-radius: 4px; }
.boro:hover { background: var(--surface-0); }
.boro .bar { height: 10px; background: var(--accent); border-radius: 0 4px 4px 0; min-width: 1px; }
.boro .v { text-align: right; font-variant-numeric: tabular-nums; }
.boro.dim { opacity: .4; }
.total { display: flex; justify-content: space-between; border-top: 1px solid var(--border); margin-top: 6px; padding-top: 6px; font-weight: 600; font-variant-numeric: tabular-nums; }
.muted { color: var(--text-muted); }
.hero { font-size: 26px; font-weight: 600; font-variant-numeric: tabular-nums; }
#chart svg { display: block; width: 100%; max-width: 440px; }
#chart .axis text { fill: var(--text-muted); font-size: 10px; }
#chart .grid line { stroke: var(--border); }
.note { font-size: 11px; color: var(--text-muted); margin-top: 10px; }
.note p { margin: 0 0 6px; }
details summary { cursor: pointer; color: var(--text-secondary); }
table.data { width: 100%; border-collapse: collapse; font-size: 11px; font-variant-numeric: tabular-nums; margin-top: 6px; }
table.data td, table.data th { padding: 2px 4px; text-align: right; border-bottom: 1px solid var(--border); }
table.data td:first-child, table.data th:first-child { text-align: left; }
@media (max-width: 820px) {
  .app { grid-template-columns: 1fr; grid-template-rows: auto 55vh auto auto; height: auto; }
  aside { grid-row: auto; grid-column: 1; border-left: 0; border-top: 1px solid var(--border); }
  .timebar { grid-column: 1; }
  header { padding: 10px 16px; }
}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>NYC new residential construction</h1>
    <div class="seg" id="metric" role="group" aria-label="Measure">
      <button data-v="u" aria-pressed="true">Units</button><button data-v="j">Buildings</button>
    </div>
    <div class="seg" id="flow" role="group" aria-label="Stage">
      <button data-v="p" aria-pressed="true">Permitted</button><button data-v="c">Completed</button><button data-v="i">In progress</button>
    </div>
    <label>Borough <select id="boro"><option value="">All boroughs</option></select></label>
    <div class="ms" id="ms">
      <button id="msBtn" aria-haspopup="true" aria-expanded="false"><span id="msLabel">All neighborhoods</span> ▾</button>
      <div class="ms-panel" id="msPanel" hidden>
        <div class="ms-head"><input id="msSearch" type="search" placeholder="Search neighborhoods" aria-label="Search neighborhoods"><button id="msClear">Clear</button></div>
        <div class="ms-list" id="msList"></div>
      </div>
    </div>
  </header>
  <div id="map"><div class="legend" id="legend"></div><div class="tip" id="tip"></div></div>
  <aside>
    <h2 id="totalsTitle">Borough totals</h2>
    <div id="boros"></div>
    <h2 id="nbhdTitle">Neighborhood</h2>
    <div id="nbhd" class="muted">Click a neighborhood on the map to see its monthly history.</div>
    <div id="chart"></div>
    <div class="note" id="notes"></div>
  </aside>
  <div class="timebar">
    <button id="play" aria-label="Play">▶</button>
    <span id="rangeLabel"></span>
    <div class="range">
      <div class="track"><div class="fill" id="fill"></div></div>
      <input type="range" id="rs" min="0" value="0" aria-label="Start month">
      <input type="range" id="re" min="0" value="0" aria-label="End month">
      <div class="years" id="years"></div>
    </div>
    <span id="prov" class="badge" hidden>Provisional · DOB NOW</span>
  </div>
</div>
<script>
const $ = s => document.querySelector(s);
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const fmt = n => Math.round(n).toLocaleString('en-US');
const FLOW = { p: 'permitted', c: 'completed', i: 'in progress' };
const METRIC = { u: 'units', j: 'buildings' };
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const mLabel = m => `${MONTHS[+m.slice(5) - 1]} ${m.slice(0, 4)}`;

const state = { metric: 'u', flow: 'p', boro: '', ntas: new Set(), s: 0, e: 0, sel: null, playing: null };
let meta, series, cur, cum, geo, projects, ntaInfo = {}, breaks = [], breaksKey = '', map, N;

function seg(id, key) {
  $(id).addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b || b.disabled) return;
    state[key] = b.dataset.v;
    $(id).querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b));
    refresh();
  });
}

// Monthly arrays per NTA plus prefix sums (cum[k][i] = total of months < i), so any month
// range is a single subtraction. The file omits all-zero arrays.
function buildSeries() {
  cur = {}; cum = {};
  for (const nta in series) {
    cur[nta] = {}; cum[nta] = {};
    for (const k of ['pj', 'pu', 'cj', 'cu', 'ij', 'iu']) {
      const a = series[nta][k] ?? new Array(N).fill(0);
      cur[nta][k] = a;
      const c = new Array(N + 1); c[0] = 0; for (let i = 0; i < N; i++) c[i + 1] = c[i] + a[i];
      cum[nta][k] = c;
    }
  }
}

// Value for one NTA over months s..e: a total for permitted/completed, the end-of-range
// snapshot for in progress.
function valRange(nta, s, e) {
  const k = state.flow + state.metric;
  if (!cur[nta]) return 0;
  if (state.flow === 'i') return cur[nta][k][e];
  return cum[nta][k][e + 1] - cum[nta][k][s];
}
const val = nta => valRange(nta, state.s, state.e);
const inView = nta => (!state.boro || ntaInfo[nta]?.boro === state.boro) && (!state.ntas.size || state.ntas.has(nta));

// Breaks come from every window of the current length (or every month, for the in-progress
// snapshot), so colors stay comparable as the window slides or plays, and quantiles keep the
// 2015/2022 421-a spikes from washing out everything else.
function computeBreaks() {
  const L = state.flow === 'i' ? 1 : state.e - state.s + 1;
  const key = [state.flow, state.metric, state.boro, [...state.ntas].join(), L].join('|');
  if (key === breaksKey) return;
  breaksKey = key;
  const vals = [];
  for (const nta in cur) if (inView(nta)) for (let i = 0; i + L <= N; i++) { const v = valRange(nta, i, i + L - 1); if (v > 0) vals.push(v); }
  vals.sort((a, b) => a - b);
  const n = 7;
  if (!vals.length) breaks = [2, 3, 5, 10, 15, 20];
  else breaks = niceBreaks(Array.from({ length: n - 1 }, (_, i) => vals[Math.floor(vals.length * (i + 1) / n)]));
}
// Snap raw breaks to round numbers (5, 10, 25, 50, 100, 250…) so the legend reads as clean ranges.
const NICE = [];
for (let d = 1; d <= 1e6; d *= 10) for (const f of [1, 1.5, 2, 2.5, 3, 5, 7.5]) if (f * d >= 2 && Number.isInteger(f * d)) NICE.push(f * d);
function niceBreaks(raw) {
  const out = [];
  for (const r of raw) {
    let i = NICE.reduce((best, v, j) => Math.abs(Math.log(v / r)) < Math.abs(Math.log(NICE[best] / r)) ? j : best, 0);
    while (out.length && NICE[i] <= out[out.length - 1]) i++;
    out.push(NICE[i]);
  }
  return out;
}
function classOf(v) { if (v <= 0) return 0; let c = 1; for (const b of breaks) if (v >= b) c++; return c; }

function fillExpr() {
  const c = ['--zero', '--s1', '--s2', '--s3', '--s4', '--s5', '--s6', '--s7'].map(css);
  return ['match', ['coalesce', ['feature-state', 'c'], 0], 0, c[0], 1, c[1], 2, c[2], 3, c[3], 4, c[4], 5, c[5], 6, c[6], c[7]];
}

// Circle area tracks unit count (radius ~ sqrt(units)); a floor keeps 1-2 unit homes visible.
const R_SCALE = 0.36;
function radiusAt(units, zoom) { return Math.max(2, R_SCALE * Math.sqrt(Math.max(units, 1)) * (zoom >= 14 ? 2.4 : zoom <= 10 ? 0.7 : 0.7 + (zoom - 10) * 0.425)); }
function radiusExpr() {
  const at = k => ['max', 2, ['*', R_SCALE * k, ['sqrt', ['max', ['get', 'u'], 1]]]];
  return ['interpolate', ['linear'], ['zoom'], 10, at(0.7), 14, at(2.4)];
}

// Same selection as the choropleth.
function projectFilter() {
  const { s, e } = state;
  const f = state.flow === 'i' ? ['all', ['<=', ['get', 'p'], e], ['<', e, ['get', 'e']]]
    : ['all', ['>=', ['get', state.flow], s], ['<=', ['get', state.flow], e]];
  if (state.boro) f.push(['==', ['get', 'b'], state.boro]);
  if (state.ntas.size) f.push(['in', ['get', 'n'], ['literal', [...state.ntas]]]);
  return f;
}

function rangeText() {
  const a = meta.months[state.s], b = meta.months[state.e];
  if (state.flow === 'i') return `end of ${mLabel(b)}`;
  return state.s === state.e ? mLabel(b) : `${mLabel(a)} – ${mLabel(b)}`;
}
const whatText = () => `${METRIC[state.metric]} ${FLOW[state.flow]}`;

function paint() {
  // Controls are live before the basemap style loads; the load handler repaints once sources exist.
  if (!map?.getSource('nta')) return;
  for (const f of geo.features) {
    const nta = f.properties.nta;
    map.setFeatureState({ source: 'nta', id: nta }, { c: classOf(val(nta)), dim: !inView(nta), sel: nta === state.sel });
  }
  if (map.getLayer('proj')) map.setFilter('proj', projectFilter());
}

function legend() {
  const lows = [1, ...breaks];
  const rows = ['--s1', '--s2', '--s3', '--s4', '--s5', '--s6', '--s7'].map((v, i) => {
    const lo = lows[i], hi = lows[i + 1] - 1;
    const range = i === lows.length - 1 ? `${fmt(lo)}+` : lo === hi ? fmt(lo) : `${fmt(lo)}–${fmt(hi)}`;
    return `<div class="lrow"><span class="lsw" style="background:${css(v)}"></span>${range}</div>`;
  }).reverse().join('');
  const what = whatText();
  $('#legend').innerHTML = `<div class="title">${what[0].toUpperCase() + what.slice(1)}, ${rangeText()}</div><div class="lrows">${rows}<div class="lrow"><span class="lsw zero"></span>None</div></div>` +
    (map ? `<div class="sizes"><span>Project units</span>${[10, 100, 500].map(u => { const d = 2 * radiusAt(u, map.getZoom()); return `<div><span class="dot" style="width:${d}px;height:${d}px"></span>${u}</div>`; }).join('')}</div>` : '');
}

function boroPanel() {
  const tot = {};
  for (const b of meta.boros) tot[b] = 0;
  // A borough filter only dims the other rows; a neighborhood selection restricts the totals to it.
  for (const nta in cur) { const b = ntaInfo[nta]?.boro; if (b in tot && (!state.ntas.size || state.ntas.has(nta))) tot[b] += val(nta); }
  const max = Math.max(1, ...Object.values(tot));
  const sum = Object.values(tot).reduce((a, b) => a + b, 0);
  $('#totalsTitle').textContent = `Borough totals · ${rangeText()}`;
  const scope = state.ntas.size ? ` · ${state.ntas.size} selected neighborhood${state.ntas.size > 1 ? 's' : ''}` : '';
  $('#boros').innerHTML = `<div class="muted" style="margin-bottom:6px">${whatText()}${scope}</div>` +
    meta.boros.map(b => `<div class="boro ${state.boro && state.boro !== b ? 'dim' : ''}" data-b="${b}"><span>${b}</span><div class="bar" style="width:${tot[b] / max * 100}%"></div><span class="v">${fmt(tot[b])}</span></div>`).join('') +
    (state.ntas.size ? `<div class="total"><span>Selected total</span><span>${fmt(sum)}</span></div>`
      : `<div class="total"><span>New York City</span><span>${fmt(sum)}</span></div>`);
}

// The clicked neighborhood, or the dropdown selection combined when nothing is clicked.
function nbhdPanel() {
  const list = state.sel ? [state.sel] : [...state.ntas];
  if (!list.length) { $('#nbhd').classList.add('muted'); $('#nbhd').textContent = 'Click a neighborhood on the map, or pick some from the Neighborhoods menu, to see monthly history.'; $('#chart').innerHTML = ''; return; }
  const k = state.flow + state.metric, s = new Array(N).fill(0);
  for (const nta of list) cur[nta]?.[k].forEach((v, i) => s[i] += v);
  const total = list.reduce((a, nta) => a + val(nta), 0);
  const head = list.length === 1
    ? `<div style="font-weight:600">${ntaInfo[list[0]].name}</div><div class="muted">${ntaInfo[list[0]].boro} · ${list[0]}</div>`
    : `<div style="font-weight:600">${list.length} neighborhoods combined</div><div class="muted">${list.map(n => ntaInfo[n].name).join(', ')}</div>`;
  $('#nbhd').classList.remove('muted');
  $('#nbhd').innerHTML = head + `<div style="margin-top:8px"><span class="hero">${fmt(total)}</span> <span class="muted">${whatText()} · ${rangeText()}</span></div>`;
  drawChart(s);
}

// Monthly series: bars for flows, an area for the in-progress snapshot, with the selected
// range shaded.
function drawChart(s) {
  const W = 328, H = 170, m = { l: 36, r: 6, t: 10, b: 20 };
  const n = s.length, iw = W - m.l - m.r, ih = H - m.t - m.b, cw = iw / n;
  const max = Math.max(1, ...s);
  const nice = (() => { const p = 10 ** Math.floor(Math.log10(max)); for (const f of [1, 2, 2.5, 5, 10]) if (f * p >= max) return f * p; })();
  const x = i => m.l + (i + .5) * cw, y = v => m.t + ih - v / nice * ih, bw = Math.max(1, cw - .6);
  const provIdx = meta.provisionalFrom ? meta.months.indexOf(meta.provisionalFrom) : -1;
  const inR = i => state.flow === 'i' ? i === state.e : i >= state.s && i <= state.e;
  let marks;
  if (state.flow === 'i') {
    const pts = s.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
    marks = `<polygon points="${x(0)},${y(0)} ${pts} ${x(n - 1)},${y(0)}" fill="${css('--accent')}" opacity=".18"/><polyline points="${pts}" fill="none" stroke="${css('--accent')}" stroke-width="2" stroke-linejoin="round"/>`;
  } else {
    marks = s.map((v, i) => v > 0 ? `<rect x="${(x(i) - bw / 2).toFixed(1)}" y="${y(v).toFixed(1)}" width="${bw.toFixed(2)}" height="${(y(0) - y(v)).toFixed(1)}" fill="${css('--accent')}" opacity="${inR(i) ? 1 : .35}"/>` : '').join('');
  }
  const band = state.flow === 'i'
    ? `<line x1="${x(state.e)}" x2="${x(state.e)}" y1="${m.t}" y2="${m.t + ih}" stroke="${css('--text-primary')}" stroke-dasharray="2 2"/>`
    : `<rect x="${m.l + state.s * cw}" y="${m.t}" width="${(state.e - state.s + 1) * cw}" height="${ih}" fill="${css('--accent')}" opacity=".12"/>`;
  const yt = [0, nice / 2, nice].map(v => `<g class="grid"><line x1="${m.l}" x2="${W - m.r}" y1="${y(v)}" y2="${y(v)}"/></g><g class="axis"><text x="${m.l - 4}" y="${y(v) + 3}" text-anchor="end">${v >= 1000 ? v / 1000 + 'k' : v}</text></g>`).join('');
  const xt = meta.months.map((mo, i) => mo.endsWith('-01') && +mo.slice(0, 4) % 4 === 2 ? `<g class="axis"><text x="${x(i)}" y="${H - 6}" text-anchor="middle">${mo.slice(0, 4)}</text></g>` : '').join('');
  const prov = provIdx >= 0 ? `<rect x="${m.l + provIdx * cw}" y="${m.t}" width="${(n - provIdx) * cw}" height="${ih}" fill="${css('--provisional')}" opacity=".08"/>` : '';
  $('#chart').innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Monthly ${whatText()}">${yt}${prov}${band}${xt}${marks}
    <line id="hov" y1="${m.t}" y2="${m.t + ih}" stroke="${css('--text-muted')}" stroke-width="1" visibility="hidden"/>
    <rect id="hit" x="${m.l}" y="${m.t}" width="${iw}" height="${ih}" fill="transparent" style="cursor:pointer"/></svg>
    <details><summary>Table view</summary><table class="data"><tr><th>Year</th><th>${state.flow === 'i' ? 'Dec snapshot' : 'Total'}</th></tr>${yearRows(s)}</table></details>`;
  const svg = $('#chart svg'), hit = $('#hit'), tip = $('#tip');
  const idxAt = e => { const r = svg.getBoundingClientRect(); return Math.max(0, Math.min(n - 1, Math.floor(((e.clientX - r.left) * W / r.width - m.l) / cw))); };
  hit.addEventListener('mousemove', e => {
    const i = idxAt(e);
    $('#hov').setAttribute('x1', x(i)); $('#hov').setAttribute('x2', x(i)); $('#hov').setAttribute('visibility', 'visible');
    showTip(e, `${mLabel(meta.months[i])}<br><b>${fmt(s[i])}</b> ${whatText()}${provIdx >= 0 && i >= provIdx ? '<br><span class="muted">provisional</span>' : ''}`);
  });
  hit.addEventListener('mouseleave', () => { $('#hov').setAttribute('visibility', 'hidden'); tip.style.display = 'none'; });
  // Clicking the chart moves the window to end at that month, keeping its length.
  hit.addEventListener('click', e => { const i = idxAt(e), L = state.e - state.s; setRange(Math.max(0, i - L), Math.max(i, L)); });
}
function yearRows(s) {
  const by = {};
  meta.months.forEach((mo, i) => { const y = mo.slice(0, 4); by[y] = state.flow === 'i' ? s[i] : (by[y] || 0) + s[i]; });
  return Object.entries(by).map(([y, v]) => `<tr><td>${y}</td><td>${fmt(v)}</td></tr>`).join('');
}

function showTip(e, html) {
  const tip = $('#tip');
  tip.innerHTML = html; tip.style.display = 'block'; tip.style.position = 'fixed';
  tip.style.left = Math.min(window.innerWidth - tip.offsetWidth - 8, e.clientX + 12) + 'px';
  tip.style.top = (e.clientY + 12) + 'px';
}

function setRange(s, e) {
  s = Math.max(0, Math.min(N - 1, s)); e = Math.max(0, Math.min(N - 1, e));
  if (s > e) [s, e] = [e, s];
  state.s = s; state.e = e;
  $('#rs').value = s; $('#re').value = e;
  const pct = i => i / (N - 1) * 100;
  $('#fill').style.left = (state.flow === 'i' ? pct(e) : pct(s)) + '%';
  $('#fill').style.width = (state.flow === 'i' ? 0 : pct(e) - pct(s)) + '%';
  // When the handles meet at the right end, the start handle must sit on top or it can't be dragged back.
  $('#rs').style.zIndex = s >= N - 2 ? 3 : 1;
  const months = e - s + 1;
  $('#rangeLabel').textContent = rangeText() + (state.flow !== 'i' && months > 1 ? ` · ${months} mo` : '');
  $('#prov').hidden = !(meta.provisionalFrom && meta.months[e] >= meta.provisionalFrom);
  computeBreaks(); legend(); // the legend title carries the range, so redraw it every time
  paint(); boroPanel(); nbhdPanel();
}

function refresh() {
  $('#rs').disabled = state.flow === 'i';
  breaksKey = '';
  setRange(state.s, state.e);
}

function play() {
  if (state.playing) { clearInterval(state.playing); state.playing = null; $('#play').textContent = '▶'; $('#play').setAttribute('aria-label', 'Play'); return; }
  const L = state.e - state.s;
  if (state.e >= N - 1) setRange(0, L);
  $('#play').textContent = '❚❚'; $('#play').setAttribute('aria-label', 'Pause');
  // Slides the whole window forward one month at a time.
  state.playing = setInterval(() => { if (state.e >= N - 1) return play(); setRange(state.s + 1, state.e + 1); }, 140);
}

function fitView() {
  const bb = [180, 90, -180, -90];
  const walk = c => typeof c[0] === 'number' ? (bb[0] = Math.min(bb[0], c[0]), bb[1] = Math.min(bb[1], c[1]), bb[2] = Math.max(bb[2], c[0]), bb[3] = Math.max(bb[3], c[1])) : c.forEach(walk);
  geo.features.forEach(f => { if (inView(f.properties.nta)) walk(f.geometry.coordinates); });
  map.fitBounds([[bb[0], bb[1]], [bb[2], bb[3]]], { padding: 30, duration: 600 });
}

const ntaSorted = () => Object.values(ntaInfo).filter(p => series[p.nta]).sort((a, b) => a.boro.localeCompare(b.boro) || a.name.localeCompare(b.name));
function renderNtaList() {
  const q = $('#msSearch').value.trim().toLowerCase();
  let html = '', grp = '';
  for (const p of ntaSorted()) {
    if (state.boro && p.boro !== state.boro) continue;
    if (q && !p.name.toLowerCase().includes(q)) continue;
    if (p.boro !== grp) { grp = p.boro; html += `<div class="grp">${grp}</div>`; }
    html += `<label><input type="checkbox" value="${p.nta}" ${state.ntas.has(p.nta) ? 'checked' : ''}>${p.name}</label>`;
  }
  $('#msList').innerHTML = html || '<div class="muted" style="padding:8px 10px">No matches</div>';
  const n = state.ntas.size;
  $('#msLabel').textContent = !n ? 'All neighborhoods' : n === 1 ? ntaInfo[[...state.ntas][0]].name : `${n} neighborhoods`;
}
function setupNtaPicker() {
  const open = v => { $('#msPanel').hidden = !v; $('#msBtn').setAttribute('aria-expanded', v); if (v) { renderNtaList(); $('#msSearch').focus(); } };
  $('#msBtn').addEventListener('click', () => open($('#msPanel').hidden));
  document.addEventListener('click', e => { if (!$('#ms').contains(e.target)) open(false); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') open(false); });
  $('#msSearch').addEventListener('input', renderNtaList);
  $('#msClear').addEventListener('click', () => { state.ntas.clear(); state.sel = null; renderNtaList(); fitView(); refresh(); });
  $('#msList').addEventListener('change', e => {
    const n = e.target.value;
    e.target.checked ? state.ntas.add(n) : state.ntas.delete(n);
    state.sel = null; // the side panel follows the selection
    renderNtaList(); fitView(); refresh();
  });
  renderNtaList();
}

async function main() {
  [meta, series, geo, projects] = await Promise.all(['data/meta.json', 'data/series.json', 'data/ntas.geojson', 'data/projects.json'].map(u => fetch(u).then(r => r.json())));
  N = meta.months.length;
  for (const f of geo.features) ntaInfo[f.properties.nta] = f.properties;
  const projGeo = { type: 'FeatureCollection', features: projects.rows.map(([lon, lat, u, p, c, e, b, a, fl, ty, n]) => ({
    type: 'Feature', geometry: { type: 'Point', coordinates: [lon, lat] },
    properties: { u, p, c, e, ty, n, b: projects.boros[b], a, alt: fl.includes('a'), dob: fl.includes('d') } })) };
  buildSeries();

  meta.boros.forEach(b => $('#boro').insertAdjacentHTML('beforeend', `<option>${b}</option>`));
  $('#rs').max = $('#re').max = N - 1;
  $('#years').innerHTML = meta.months.map((mo, i) => mo.endsWith('-01') && +mo.slice(0, 4) % 2 === 0 ? `<span style="left:${i / (N - 1) * 100}%">${mo.slice(0, 4)}</span>` : '').join('');
  // Open on the last 12 months fully covered by the Housing Database (its cutoff month is partial).
  const last = meta.hdbPermitCutoff ? meta.months.indexOf(meta.hdbPermitCutoff.slice(0, 7)) - 1 : N - 1;
  state.s = last - 11; state.e = last;
  $('#notes').innerHTML = `<p>Source: NYC DCP Housing Database ${meta.hdbVersion} (new buildings${meta.includeAlterations ? ' and unit-adding alterations' : ''}; withdrawn jobs excluded). Units are net new Class A units. Permitted by first permit date, completed by first certificate of occupancy.</p>` +
    `<p>Project tooltips show building type, set by the finished building's unit count: houses (1–2 units), small multifamily (3–9), mid-size apartments (10–49), large apartments (50+). DOB's own building-class fields are blank or "Other" for too many new buildings to use.</p>` +
    (meta.provisionalFrom ? `<p>From ${mLabel(meta.provisionalFrom)} on, permits come from DOB NOW new-building filings not yet in the Housing Database (one record per job, earliest permit). Completions stop at ${meta.hdbCompleteCutoff}, so in-progress counts after that date run high.</p>` : '') +
    (meta.staleYears ? `<p>"In progress" = permitted and not yet complete at the end of the range; jobs still open ${meta.staleYears} years after their permit are treated as abandoned.</p>` : '') +
    `<p>The 2015 and 2022 spikes are filings rushed in before the 421-a tax break expired. Color breaks are computed over every window of the selected length, so sliding or playing the window stays comparable.</p>`;

  map = new maplibregl.Map({
    container: 'map',
    style: matchMedia('(prefers-color-scheme: dark)').matches ? 'https://basemaps.cartocdn.com/gl/dark-matter-nolabels-gl-style/style.json' : 'https://basemaps.cartocdn.com/gl/positron-nolabels-gl-style/style.json',
    center: [-73.94, 40.70], zoom: 9.6, attributionControl: { compact: true },
  });
  map.addControl(new maplibregl.NavigationControl({ showCompass: false }), 'top-right');
  map.on('load', () => {
    map.addSource('nta', { type: 'geojson', data: geo, promoteId: 'nta' });
    map.addLayer({ id: 'nta-fill', type: 'fill', source: 'nta', paint: {
      'fill-color': fillExpr(),
      'fill-opacity': ['case', ['boolean', ['feature-state', 'dim'], false], 0.15, 0.92] } });
    map.addLayer({ id: 'nta-line', type: 'line', source: 'nta', paint: { 'line-color': css('--outline'), 'line-width': 0.6 } });
    map.addLayer({ id: 'nta-sel', type: 'line', source: 'nta', paint: { 'line-color': css('--text-primary'), 'line-width': ['case', ['boolean', ['feature-state', 'sel'], false], 2.5, 0] } });
    map.addSource('proj', { type: 'geojson', data: projGeo });
    map.addLayer({ id: 'proj', type: 'circle', source: 'proj', filter: projectFilter(), paint: {
      'circle-radius': radiusExpr(), 'circle-color': css('--marker'), 'circle-opacity': 0.7,
      'circle-stroke-color': css('--outline'), 'circle-stroke-width': 1 } });
    const NEVER = projects.never, when = i => i >= 0 && i < NEVER ? mLabel(meta.months[i]) : i < 0 ? 'before 2010' : null;
    // One handler so a project under the cursor wins over the neighborhood beneath it.
    map.on('mousemove', e => {
      const hit = map.queryRenderedFeatures(e.point, { layers: ['proj', 'nta-fill'] });
      const pr = hit.find(f => f.layer.id === 'proj'), n = hit.find(f => f.layer.id === 'nta-fill');
      map.getCanvas().style.cursor = pr || n ? 'pointer' : '';
      if (pr) {
        const p = pr.properties;
        showTip(e.originalEvent, `<div style="font-weight:600">${p.a || 'Address unknown'}</div><b>${fmt(p.u)}</b> units · ${p.alt ? 'alteration' : 'new building'}` +
          `<br><span class="muted">${meta.buildingTypes[p.ty]}<br>Permitted ${when(p.p) ?? '—'}${when(p.c) ? ` · completed ${when(p.c)}` : ''}${p.dob ? '<br>DOB NOW filing (provisional)' : ''}</span>`);
      } else if (n) {
        const p = n.properties;
        showTip(e.originalEvent, `<div style="font-weight:600">${p.name}</div><span class="muted">${p.boro}</span><br><b>${fmt(val(p.nta))}</b> ${whatText()}`);
      } else $('#tip').style.display = 'none';
    });
    map.on('mouseout', () => { $('#tip').style.display = 'none'; });
    map.on('zoomend', legend);
    map.on('click', 'nta-fill', e => { state.sel = e.features[0].properties.nta; paint(); nbhdPanel(); });
    refresh();
  });

  seg('#metric', 'metric'); seg('#flow', 'flow');
  const setBoro = b => {
    state.boro = b; $('#boro').value = b;
    // Neighborhoods outside the new borough drop out of the selection.
    if (b) for (const n of [...state.ntas]) if (ntaInfo[n].boro !== b) state.ntas.delete(n);
    renderNtaList(); fitView(); refresh();
  };
  $('#boro').addEventListener('change', e => setBoro(e.target.value));
  $('#boros').addEventListener('click', e => { const b = e.target.closest('.boro'); if (b) setBoro(state.boro === b.dataset.b ? '' : b.dataset.b); });
  setupNtaPicker();
  $('#rs').addEventListener('input', e => setRange(Math.min(+e.target.value, state.e), state.e));
  $('#re').addEventListener('input', e => setRange(state.s, Math.max(+e.target.value, state.flow === 'i' ? 0 : state.s)));
  $('#play').addEventListener('click', play);
  document.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
    if (e.key === ' ') { e.preventDefault(); play(); }
    if (e.key === 'ArrowRight' && state.e < N - 1) setRange(state.s + 1, state.e + 1);
    if (e.key === 'ArrowLeft' && state.s > 0) setRange(state.s - 1, state.e - 1);
  });
}
main();
</script>
</body>
</html>
